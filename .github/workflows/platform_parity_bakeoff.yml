# Cross-platform search accuracy parity — same 70-query real-customer bakeoff
# on ubuntu / Windows / Mac Silicon / Mac Intel with production defaults
# (production_v8 index, MAX fusion, ORB on). Uploads per-platform JSON, then
# diffs them against macos-15-intel.

name: Platform Parity Bakeoff

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "dev_tools/search_quality/**"
      - "eval/real_customer_release.jsonl"
      - "eval/real_customer_release/**"
      - "src/ai/**"
      - "src/core/use_cases/search_tiles.py"
      - ".github/workflows/platform_parity_bakeoff.yml"
  push:
    branches: [main]
    paths:
      - "dev_tools/search_quality/**"
      - "eval/real_customer_release.jsonl"
      - "eval/real_customer_release/**"
      - "src/ai/**"
      - "src/core/use_cases/search_tiles.py"
      - ".github/workflows/platform_parity_bakeoff.yml"

concurrency:
  group: platform-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bakeoff:
    name: Bakeoff (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        id: setup-python
        if: matrix.os != 'macos-15-intel'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Python 3.12 (Intel x64)
        id: setup-python-intel
        if: matrix.os == 'macos-15-intel'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Cache DINOv2 model weights
        id: model-cache
        uses: actions/cache@v4
        with:
          path: model_weights/dinov2-large
          key: dinov2-large-v2-${{ hashFiles('scripts/download_dinov2_model.py') }}

      - name: Install Linux Qt / system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 libegl1 libglib2.0-0

      - name: Install dependencies (macOS Intel)
        if: matrix.os == 'macos-15-intel'
        shell: bash
        env:
          PYTHON_SETUP_PATH: ${{ steps.setup-python-intel.outputs.python-path }}
        run: |
          set -euo pipefail
          source scripts/install_mac_deps.sh x64
          echo "MACOS_PYTHON_PATH=$MACOS_PYTHON_PATH" >> "$GITHUB_ENV"
          echo "RUN_PYTHON=$MACOS_PYTHON_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS Apple Silicon)
        if: matrix.os == 'macos-15'
        shell: bash
        env:
          PYTHON_SETUP_PATH: ${{ steps.setup-python.outputs.python-path }}
        run: |
          set -euo pipefail
          source scripts/install_mac_deps.sh arm64
          echo "MACOS_PYTHON_PATH=$MACOS_PYTHON_PATH" >> "$GITHUB_ENV"
          echo "RUN_PYTHON=$MACOS_PYTHON_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies (Linux / Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          echo "RUN_PYTHON=python" >> "$GITHUB_ENV"

      - name: Download DINOv2 weights
        shell: bash
        env:
          TILEVISION_HF_DOWNLOAD_ATTEMPTS: "6"
          HF_HUB_ENABLE_HF_TRANSFER: "0"
        run: |
          set -euo pipefail
          if [ -n "${MACOS_PYTHON_PATH:-}" ]; then
            bash scripts/macos_build_python.sh scripts/download_dinov2_model.py
          else
            python scripts/download_dinov2_model.py
          fi
          test -f model_weights/dinov2-large/config.json

      - name: Run platform parity bakeoff (70 queries, MAX, ORB on)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          TILEVISION_DEV_MODE: "1"
          TILEVISION_OFFLINE_MODEL: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          KMP_DUPLICATE_LIB_OK: "TRUE"
          PYTHONFAULTHANDLER: "1"
        run: |
          set -euo pipefail
          OUT="${GITHUB_WORKSPACE}/parity_out/${{ matrix.os }}"
          mkdir -p "$OUT"
          if [ -n "${MACOS_PYTHON_PATH:-}" ]; then
            bash scripts/macos_build_python.sh \
              -u dev_tools/search_quality/run_platform_parity_bakeoff.py \
              --real-queries eval/real_customer_release.jsonl \
              --out "$OUT" \
              --platform-label "${{ matrix.os }}" \
              --orb-verification on
          else
            "${RUN_PYTHON:-python}" -u \
              dev_tools/search_quality/run_platform_parity_bakeoff.py \
              --real-queries eval/real_customer_release.jsonl \
              --out "$OUT" \
              --platform-label "${{ matrix.os }}" \
              --orb-verification on
          fi
          test -f "$OUT/platform_bakeoff_report.json"
          echo "=== platform_bakeoff_report.json (${{ matrix.os }}) summary ==="
          # Avoid `json.tool | head` under pipefail (exit 32 after a good bakeoff).
          OUT="$OUT" "${RUN_PYTHON:-python}" - <<'PY'
          import json, pathlib, os
          p = pathlib.Path(os.environ["OUT"]) / "platform_bakeoff_report.json"
          d = json.loads(p.read_text(encoding="utf-8"))
          print("platform", d.get("platform"))
          print("recall@1", d.get("recall@1"), "recall@5", d.get("recall@5"))
          print("kinds", sorted((d.get("by_query_kind") or {})))
          print("runtime", d.get("runtime"))
          PY

      - name: Upload platform bakeoff artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-bakeoff-${{ matrix.os }}
          path: parity_out/${{ matrix.os }}/platform_bakeoff_report.json
          if-no-files-found: warn

  compare:
    name: Compare platform parity
    needs: bakeoff
    # Still diff whichever platform artifacts landed (fail-fast is off on bakeoff).
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all platform bakeoff artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: platform-bakeoff-*
          path: parity_artifacts
          merge-multiple: false

      - name: Diff platforms vs macos-15-intel
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parity_compare
          REPORTS=()
          if [[ -d parity_artifacts ]]; then
            while IFS= read -r -d '' f; do
              REPORTS+=("$f")
            done < <(find parity_artifacts -name 'platform_bakeoff_report.json' -print0 | sort -z)
          fi
          echo "Found ${#REPORTS[@]} report(s):"
          printf '  %s\n' "${REPORTS[@]:-}"
          if [[ "${#REPORTS[@]}" -lt 2 ]]; then
            echo "::error::Need at least 2 platform reports to compare (got ${#REPORTS[@]})."
            exit 1
          fi
          set +e
          python dev_tools/search_quality/compare_platform_parity.py \
            --reports "${REPORTS[@]}" \
            --baseline macos-15-intel \
            --tolerance 0.02 \
            --out parity_compare | tee parity_compare/console.txt
          code=$?
          set -e
          echo "compare_exit=${code}" >> "$GITHUB_OUTPUT"
          if [[ ! -f parity_compare/platform_parity_table.txt ]]; then
            echo "::error::Missing platform_parity_table.txt"
            exit 1
          fi
          echo "======== PARITY TABLE ========"
          cat parity_compare/platform_parity_table.txt
          exit "${code}"

      - name: Upload parity comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-parity-comparison
          path: |
            parity_compare/platform_parity_report.json
            parity_compare/platform_parity_table.txt
            parity_compare/console.txt
          if-no-files-found: warn

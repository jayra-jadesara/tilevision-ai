name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid stacking multiple Test matrix runs on the same ref (burns hosted-runner
# capacity and causes "job was not acquired" cancellations under load).
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Cap hung runners (e.g. Windows "lost communication") so the matrix fails
    # fast enough to retry instead of sitting for ~50 minutes.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel matches other workflows and avoids macos-latest
        # (arm64) capacity queues that cancel with "job was not acquired".
        os: [ubuntu-latest, macos-15-intel, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 libegl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          TILEVISION_DEV_MODE: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          KMP_DUPLICATE_LIB_OK: "TRUE"
          PYTHONFAULTHANDLER: "1"
          TILEVISION_PYTEST_MARKERS: ${{ runner.os == 'macOS' && 'not slow and not faiss_search' || 'not slow' }}
        shell: bash
        run: python scripts/run_ci_pytest.py

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid stacking multiple Test matrix runs on the same ref (burns hosted-runner
# capacity and causes "job was not acquired" cancellations under load).
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Cap hung runners (e.g. Windows "lost communication") so the matrix fails
    # fast enough to retry instead of sitting for ~50 minutes.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Customer stacks: Linux CI + Windows + Mac Intel + Mac Apple Silicon.
        os: [ubuntu-latest, macos-15-intel, macos-15, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        id: setup-python
        if: matrix.os != 'macos-15-intel'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Python 3.12 (Intel x64)
        id: setup-python-intel
        if: matrix.os == 'macos-15-intel'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 libegl1 libglib2.0-0

      - name: Install dependencies (macOS Intel)
        if: matrix.os == 'macos-15-intel'
        shell: bash
        env:
          PYTHON_SETUP_PATH: ${{ steps.setup-python-intel.outputs.python-path }}
        run: |
          set -euo pipefail
          source scripts/install_mac_deps.sh x64
          "$MACOS_PYTHON_PATH" -m pip install --no-cache-dir pytest
          echo "MACOS_PYTHON_PATH=$MACOS_PYTHON_PATH" >> "$GITHUB_ENV"
          echo "RUN_PYTHON=$MACOS_PYTHON_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS Apple Silicon)
        if: matrix.os == 'macos-15'
        shell: bash
        env:
          PYTHON_SETUP_PATH: ${{ steps.setup-python.outputs.python-path }}
        run: |
          set -euo pipefail
          source scripts/install_mac_deps.sh arm64
          "$MACOS_PYTHON_PATH" -m pip install --no-cache-dir pytest
          echo "MACOS_PYTHON_PATH=$MACOS_PYTHON_PATH" >> "$GITHUB_ENV"
          echo "RUN_PYTHON=$MACOS_PYTHON_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies (Linux / Windows)
        if: runner.os != 'macOS'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          echo "RUN_PYTHON=python" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          TILEVISION_DEV_MODE: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          KMP_DUPLICATE_LIB_OK: "TRUE"
          PYTHONFAULTHANDLER: "1"
          TILEVISION_PYTEST_MARKERS: ${{ runner.os == 'macOS' && 'not slow and not faiss_search' || 'not slow' }}
        shell: bash
        run: |
          set -euo pipefail
          PY="${RUN_PYTHON:-python}"
          "$PY" scripts/run_ci_pytest.py

  # Real Apple Silicon MPS forward path (hosted macos-15 = M-series hardware).
  # Complements pytest (macos-15); does NOT replace manual GUI search QA.
  mps-silicon-validate:
    name: Mac Silicon MPS validation (real hardware)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache DINOv2 model weights
        id: model-cache
        uses: actions/cache@v4
        with:
          path: model_weights/dinov2-large
          key: dinov2-large-v2-${{ hashFiles('scripts/download_dinov2_model.py') }}

      - name: Install dependencies (macOS Apple Silicon)
        shell: bash
        env:
          PYTHON_SETUP_PATH: ${{ steps.setup-python.outputs.python-path }}
        run: |
          set -euo pipefail
          source scripts/install_mac_deps.sh arm64
          echo "MACOS_PYTHON_PATH=$MACOS_PYTHON_PATH" >> "$GITHUB_ENV"

      - name: Download DINOv2 weights
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          TILEVISION_HF_DOWNLOAD_ATTEMPTS: "6"
          HF_HUB_ENABLE_HF_TRANSFER: "0"
        run: |
          set -euo pipefail
          "$MACOS_PYTHON_PATH" scripts/download_dinov2_model.py
          test -f model_weights/dinov2-large/config.json

      - name: Run MPS query hang-watchdog validation (30 rounds)
        shell: bash
        env:
          TILEVISION_DEV_MODE: "1"
          TILEVISION_OFFLINE_MODEL: "1"
          PYTHONFAULTHANDLER: "1"
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: |
          set -euo pipefail
          echo "=== Mac Silicon MPS validation (real hardware runner) ==="
          uname -m
          "$MACOS_PYTHON_PATH" -c "import platform,torch; print('machine', platform.machine()); print('mps', getattr(torch.backends,'mps',None) and torch.backends.mps.is_available())"

          set +e
          "$MACOS_PYTHON_PATH" scripts/validate_mac_silicon_mps.py --rounds 30 2>&1 | tee mps_validation.log
          code=${PIPESTATUS[0]}
          set -e

          echo "=== validate_mac_silicon_mps.py exit code: ${code} ==="

          if grep -q "WATCHDOG FIRED" mps_validation.log; then
            echo "::warning::MPS watchdog fired during CI validation — review timings in the log (fallback engaged; not a silent hang). Consider tightening TILEVISION_MPS_QUERY_TIMEOUT_S after reviewing median latency."
          fi

          # Script exit codes:
          #   0 = MPS stayed active for the full batch (clean)
          #   2 = not Apple Silicon / MPS unavailable (misconfigured runner) → hard fail
          #   1 = embed failure, OR left MPS (including watchdog fire after fallback)
          # Watchdog fire is the designed hang catch — surface as warning, not red.
          # Any other non-zero must fail the check (do not merge signal).
          if [[ "${code}" -eq 0 ]]; then
            echo "MPS validation OK — stayed on Metal for the whole batch."
            exit 0
          fi
          if [[ "${code}" -ne 0 ]] && grep -q "WATCHDOG FIRED" mps_validation.log; then
            echo "Watchdog fired (script exit ${code}) — treating as warning, not hard failure."
            exit 0
          fi
          echo "::error::MPS validation failed with exit ${code} (no watchdog-fire carve-out)."
          exit "${code}"
